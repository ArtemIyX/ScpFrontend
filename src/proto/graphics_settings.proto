syntax = "proto3";
option optimize_for = LITE_RUNTIME;
package scp.webui.v1;



// Coarse preset buckets for settings that expose the full very-low to ultra range.
enum GraphicsQuality
{
  GRAPHICS_QUALITY_VERY_LOW = 0;
  GRAPHICS_QUALITY_LOW = 1;
  GRAPHICS_QUALITY_MEDIUM = 2;
  GRAPHICS_QUALITY_HIGH = 3;
  GRAPHICS_QUALITY_ULTRA = 4;
}

// Preset buckets for settings that use low to ultra plus a custom mode.
enum GraphicsQualityDetailed
{
  GRAPHICS_QUALITY_DETAILED_LOW = 0;
  GRAPHICS_QUALITY_DETAILED_MEDIUM = 1;
  GRAPHICS_QUALITY_DETAILED_HIGH = 2;
  GRAPHICS_QUALITY_DETAILED_ULTRA = 3;
  GRAPHICS_QUALITY_DETAILED_CUSTOM = 4;
}

// Supported anti-aliasing methods.
enum AntiAliasingType
{
  AA_TYPE_NONE = 0;
  AA_TYPE_FXAA = 1;
  AA_TYPE_TAA = 2;
  AA_TYPE_MSAA = 3;
  AA_TYPE_TSR = 4;
  AA_TYPE_SMAA = 5;
}

// Frame-generation multiplier options.
enum FrameGenScale
{
  FG_GEN_OFF = 0;
  FG_GEN_2 = 1;
  FG_GEN_3 = 2;
  FG_GEN_4 = 3;
}

// Supported temporal upscaler implementations.
enum UpscaleMode
{
  UPSCALE_MODE_OFF = 0;
  UPSCALE_MODE_DLSS = 1;
  UPSCALE_MODE_FSR = 2;
}

// Common quality presets used by supported upscalers.
enum UpscaleQuality
{
  UPSCALE_QUAL_DLAA = 0;
  UPSCALE_QUAL_ULTRA_QUALITY = 1;
  UPSCALE_QUAL_QUALITY = 2;
  UPSCALE_QUAL_BALANCED = 3;
  UPSCALE_QUAL_PERFORMANCE = 4;
  UPSCALE_QUAL_ULTRA_PERFORMANCE = 5;
}

message ResolutionScaleResponse
{
  uint32 resolution_scale = 1;
}

message ResolutionScaleSetRequest
{
  uint32 resolution_scale = 1;
}


// Current anti-aliasing, frame generation, and upscaler selections.
message AntiAliasingResponse
{
  AntiAliasingType aa_method = 1;
  GraphicsQuality aa_quality = 2;
  FrameGenScale fg = 3;
  UpscaleMode upscaler = 4;
  UpscaleQuality upscaler_quality = 5;
}

// Sets the active anti-aliasing method.
message AntialiasingMethodSetRequest
{
  AntiAliasingType aa_method = 1;
}

// Sets the active frame-generation mode.
message FrameGenSetRequest
{
  FrameGenScale fg = 1;
}

// Sets the active upscaler implementation.
message UpscaleModeSetRequest
{
  UpscaleMode upscaler = 1;
}

// Sets the quality preset for the active upscaler.
message UpscaleQualitySetRequest
{
  UpscaleQuality quality = 1;
}

// Sets the anti-aliasing quality preset.
message AntiAliasingQualitySetRequest
{
  GraphicsQuality quality = 1;
}

// Sets the view distance quality preset.
message ViewDistanceQualitySetRequest
{
  GraphicsQuality quality = 1;
}

// Sets the shadow quality preset.
message ShadowQualitySetRequest
{
  GraphicsQualityDetailed quality_detailed = 1;
}

// Sets the texture quality preset.
message TextureQualitySetRequest
{
  GraphicsQualityDetailed quality_detailed = 1;
}

// Sets the effects quality preset.
message EffectsQualitySetRequest
{
  GraphicsQualityDetailed quality_detailed = 1;
}

// Post-processing quality preset plus its underlying tunable values.
message PostProcessQualityResponse
{
  GraphicsQualityDetailed quality_detailed = 1;
  uint32 motion_blur_quality = 2;
  int32 blur_gbuffer = 3;
  uint32 ambient_occlusion_levels = 4;
  float ambient_occlusion_radius_scale = 5;
  uint32 depth_of_field_quality = 6;
  uint32 render_target_pool_min = 7;
  uint32 lens_flare_quality = 8;
  uint32 scene_color_fringe_quality = 9;
  uint32 eye_adaptation_quality = 10;
  uint32 bloom_quality = 11;
  uint32 fast_blur_threshold = 12;
  uint32 upscale_quality = 13;
  uint32 tonemapper_grain_quantization = 14;
}

// Texture quality preset plus its underlying tunable values.
message TextureQualityResponse
{
  GraphicsQualityDetailed quality_detailed = 1;
  float streaming_mip_bias = 2;
  uint32 max_anisotropy = 3;
  uint32 streaming_pool_size = 4;
}

// Effects quality preset plus its underlying tunable values.
message ShadowQualityResponse
{
  GraphicsQualityDetailed quality_detailed = 1;
  uint32 light_function_quality = 2;
  uint32 shadow_quality = 3;
  uint32 shadow_csm_max_cascades = 4;
  uint32 shadow_max_resolution = 5;
  float shadow_radius_threshold = 6;
  float shadow_distance_scale = 7;
  uint32 shadow_csm_transition_scale = 8;
}

message EffectsQualityResponse
{
  GraphicsQualityDetailed quality_detailed = 1;
  uint32 translucency_lighting_volume_dim = 2;
  uint32 refraction_quality = 3;
  uint32 ssr = 4;
  uint32 scene_color_format = 5;
  uint32 detail_mode = 6;
  uint32 translucency_volume_blur = 7;
  uint32 material_quality_level = 8;
  uint32 ssr_quality = 9;
}


// Identifies a specific low-level graphics tunable for custom set requests.
enum SettingType
{
  SETTING_TYPE_UNSPECIFIED = 0;

  SETTING_TYPE_MOTION_BLUR_QUALITY = 1;
  SETTING_TYPE_BLUR_GBUFFER = 2;
  SETTING_TYPE_AMBIENT_OCCLUSION_LEVELS = 3;
  SETTING_TYPE_AMBIENT_OCCLUSION_RADIUS_SCALE = 4;
  SETTING_TYPE_DEPTH_OF_FIELD_QUALITY = 5;
  SETTING_TYPE_RENDER_TARGET_POOL_MIN = 6;
  SETTING_TYPE_LENS_FLARE_QUALITY = 7;
  SETTING_TYPE_SCENE_COLOR_FRINGE_QUALITY = 8;
  SETTING_TYPE_EYE_ADAPTATION_QUALITY = 9;
  SETTING_TYPE_BLOOM_QUALITY = 10;
  SETTING_TYPE_FAST_BLUR_THRESHOLD = 11;
  SETTING_TYPE_UPSCALE_QUALITY = 12;
  SETTING_TYPE_TONEMAPPER_GRAIN_QUANTIZATION = 13;

  SETTING_TYPE_LIGHT_FUNCTION_QUALITY = 14;
  SETTING_TYPE_SHADOW_QUALITY = 15;
  SETTING_TYPE_SHADOW_CSM_MAX_CASCADES = 16;
  SETTING_TYPE_SHADOW_MAX_RESOLUTION = 17;
  SETTING_TYPE_SHADOW_RADIUS_THRESHOLD = 18;
  SETTING_TYPE_SHADOW_DISTANCE_SCALE = 19;
  SETTING_TYPE_SHADOW_CSM_TRANSITION_SCALE = 20;

  SETTING_TYPE_STREAMING_MIP_BIAS = 21;
  SETTING_TYPE_MAX_ANISOTROPY = 22;
  SETTING_TYPE_STREAMING_POOL_SIZE = 23;

  SETTING_TYPE_TRANSLUCENCY_LIGHTING_VOLUME_DIM = 24;
  SETTING_TYPE_REFRACTION_QUALITY = 25;
  SETTING_TYPE_SSR = 26;
  SETTING_TYPE_SCENE_COLOR_FORMAT = 27;
  SETTING_TYPE_DETAIL_MODE = 28;
  SETTING_TYPE_TRANSLUCENCY_VOLUME_BLUR = 29;
  SETTING_TYPE_MATERIAL_QUALITY_LEVEL = 30;
  SETTING_TYPE_SSR_QUALITY = 31;
}

// Carries a single typed low-level graphics setting value.
message GraphicsSettingValue
{
  SettingType type = 1;

  oneof value {
    uint32 uint32_value = 2;
    int32 int32_value = 3;
    float float_value = 4;
  }
}

// Applies one low-level graphics setting override.
message GraphicsSettingValueSingleRequest
{
  GraphicsSettingValue value = 1;
}

// Applies multiple low-level graphics setting overrides in one request.
message GraphicsSettingValueMultipleRequest
{
  repeated GraphicsSettingValue values = 1;
}

// Identifies which graphics settings group the client wants to fetch.
enum GraphicsSettingRequestType
{
  GRAPHICS_SETTING_RESOLUTION_SCALE = 0;
  GRAPHICS_SETTING_AA = 1;
  GRAPHICS_SETTING_VIEW_DISTANCE = 2;
  GRAPHICS_SETTING_PP_QUALITY = 3;
  GRAPHICS_SETTING_SHADOWS_QUALITY = 4;
  GRAPHICS_SETTING_TEXTURE_QUALITY = 5;
  GRAPHICS_SETTING_EFFECTS_QUALITY = 6;
}


// Requests one graphics settings section from the backend.
message RequestGetGraphicsSettings
{
  GraphicsSettingRequestType request_type = 1;
}

// Applies one graphics settings change. Only one payload variant is valid per request.
message RequestSetGraphicsSettings
{
  oneof content
  {
    ResolutionScaleSetRequest resolution_scale = 1;
    AntialiasingMethodSetRequest aa_method = 2;
    FrameGenSetRequest fg_method = 3;
    UpscaleModeSetRequest upscaler = 4;
    UpscaleQualitySetRequest upscaler_quality = 5;
    AntiAliasingQualitySetRequest aa_quality = 6;
    ViewDistanceQualitySetRequest view_distance_quality = 7;
    ShadowQualitySetRequest shadows_quality = 8;
    TextureQualitySetRequest texture_quality = 9;
    EffectsQualitySetRequest effects_quality = 10;
    GraphicsSettingValueSingleRequest single_set = 11;
    GraphicsSettingValueMultipleRequest array_set = 12;
  }
}

// Returns the graphics settings payload matching the requested section.
message ResponseGraphicsSettings
{
  GraphicsSettingRequestType requested_type = 1;
  oneof result
  {
    ResolutionScaleResponse resolution_scale = 2;
    AntiAliasingResponse aa = 3;
    GraphicsQuality view_distance = 4;
    PostProcessQualityResponse pp = 5;
    ShadowQualityResponse shadows = 6;
    TextureQualityResponse texture = 7;
    EffectsQualityResponse effects = 8;
  }
}
